<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Casino</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .container {
            text-align: center;
            padding: 50px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }
        .spin-button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #ff4500;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        .spin-button:hover {
            background-color: #e53900;
        }
        .result {
            margin-top: 20px;
            font-size: 24px;
            color: #ff4500;
        }
        .bonuses {
            margin-top: 50px;
            text-align: left;
            padding: 20px;
            background-color: #1e1e1e;
            border-radius: 10px;
        }
        .bonus-item {
            margin-bottom: 20px;
        }
        .bonus-item h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .bonus-item p {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Roblox Casino</h1>
        <p>Put your pets in Robux and spin the wheel!</p>
        <button class="spin-button" onclick="spinWheel()">Spin the Wheel</button>
        <div class="result" id="result"></div>

        <div class="bonuses">
            <div class="bonus-item">
                <h2>Daily Bonus</h2>
                <p>Get a daily bonus of 100 Robux just for logging in!</p>
            </div>
            <div class="bonus-item">
                <h2>Referral Bonus</h2>
                <p>Invite your friends and get 50 Robux for each referral!</p>
            </div>
            <div class="bonus-item">
                <h2>Deposit Bonus</h2>
                <p>Deposit 1000 Robux and get an additional 200 Robux as a bonus!</p>
            </div>
        </div>
    </div>

    <script>
        function spinWheel() {
            const resultElement = document.getElementById('result');
            const randomNumber = Math.random();
            let outcome;

            if (randomNumber < 0.5) {
                outcome = 'No';
            } else {
                outcome = 'Yes';
            }

            resultElement.innerText = `Result: ${outcome}`;

            // Simulate taking Robux regardless of the outcome
            alert('Your Robux have been taken.');
        }
    </script>
</body>
</html>
